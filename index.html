<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic Academy - Learn Arabic Words</title>
    <link rel="shortcut icon" href="asset/favicon-96.png" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            line-height: 1.6;
        }

        /* Banner Section */
        .banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .banner h1 {
            font-size: 48px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .banner p {
            font-size: 20px;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0.95;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            margin-bottom: 40px;
        }

        .card-container {
            perspective: 1100px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .card-inner {
            position: relative;
            width: 100%;
            min-height: 280px;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            border-radius: 16px;
        }

        .card-container:hover .card-inner {
            transform: scale(1.02);
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backface-visibility: hidden;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
            color: #fff;
        }

        .card-face.front {
            background-color: var(--card-color, #667eea);
        }

        .card-face.back {
            background-color: #ffffff;
            color: #333;
            transform: rotateY(180deg);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .card-image {
            width: 100px;
            height: 100px;
            margin-bottom: 18px;
            border-radius: 22px;
            overflow: hidden;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-arabic {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
            direction: rtl;
            font-family: 'Arabic Typesetting', 'Arial Unicode MS', Arial, sans-serif;
        }

        .card-english {
            font-size: 1rem;
            font-weight: 600;
            opacity: 0.95;
        }

        .card-description {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.5;
            text-align: center;
            max-width: 260px;
        }

        .back-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
        }

        .toggle-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 8px;
        }

        .toggle-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .banner h1 {
                font-size: 36px;
            }

            .banner p {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .cards-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .banner h1 {
                font-size: 28px;
            }

            .banner p {
                font-size: 14px;
            }

            .card-arabic {
                font-size: 24px;
            }

            .card-english {
                font-size: 14px;
            }
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            margin-top: 40px;
        }
    </style>
</head>
<body>

            { arabic: 'صَدِيق', english: 'Friend', color: '#FFE4B5', emoji: '🤝', description: 'A friend is someone who shares fun times and trust.', arabicDesc: 'الصديق شخص يشاركك أوقات المرح والثقة.' },

            { arabic: 'عِلْم', english: 'Knowledge', color: '#6A5ACD', emoji: '📘', description: 'Knowledge is what we gain from learning and practicing.', arabicDesc: 'العلم ما نكتسبه من التعلم والممارسة المستمرة.' }
        ];

        const cardsGrid = document.getElementById('cardsGrid');

        function makeEmojiImage(symbol, background) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><rect width="100%" height="100%" rx="24" fill="${background}"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-size="72">${symbol}</text></svg>`;
            return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
        }

        cardData.forEach((card, index) => {
            const cardContainer = document.createElement('div');
            cardContainer.className = 'card-container';
            cardContainer.tabIndex = 0;
            const uniqueId = `desc-toggle-${index}`;
            cardContainer.innerHTML = `
                <div class="card-inner" style="--card-color: ${card.color};">
                    <div class="card-face front">
                        <div class="card-image">
                            <img src="${makeEmojiImage(card.emoji, '#ffffff')}" alt="${card.english}">
                        </div>
                        <div class="card-arabic">${card.arabic}</div>
                        <div class="card-english">${card.english}</div>
                    </div>
                    <div class="card-face back">
                        <div class="back-content">
                            <button class="toggle-btn" data-id="${uniqueId}">عربي / English</button>
                            <div class="card-arabic" style="font-size: 1.6rem; margin-bottom: 10px;">${card.arabic}</div>
                            <div class="card-english" style="margin-bottom: 8px;">${card.english}</div>
                            <div class="card-description" id="${uniqueId}-en">${card.description}</div>
                            <div class="card-description" id="${uniqueId}-ar" style="display: none; direction: rtl;">${card.arabicDesc}</div>
                        </div>
                    </div>
                </div>
            `;

            const toggleBtn = cardContainer.querySelector('.toggle-btn');
            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const enDesc = document.getElementById(`${uniqueId}-en`);
                const arDesc = document.getElementById(`${uniqueId}-ar`);
                if (enDesc.style.display === 'none') {
                    enDesc.style.display = 'block';
                    arDesc.style.display = 'none';
                } else {
                    enDesc.style.display = 'none';
                    arDesc.style.display = 'block';
                }
            });

            cardContainer.addEventListener('click', () => {
                cardContainer.classList.toggle('flipped');
            });

            cardContainer.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    cardContainer.classList.toggle('flipped');
                }
            });

            cardsGrid.appendChild(cardContainer);
        });
    </script>
